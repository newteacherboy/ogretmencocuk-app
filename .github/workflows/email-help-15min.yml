name: Email verification help and reminders
on:
  push:
    paths:
      - 'first-discovery.js'
      - 'first-discovery.css'
      - 'kisisel-bilgiler.js'
      - 'supabase/functions/diji-api/member-tools-api.ts'
      - 'tests/email-help-15min-regression.test.cjs'
      - '.github/workflows/email-help-15min.yml'
  pull_request:
    paths:
      - 'first-discovery.js'
      - 'first-discovery.css'
      - 'kisisel-bilgiler.js'
      - 'supabase/functions/diji-api/member-tools-api.ts'
      - 'tests/email-help-15min-regression.test.cjs'
      - '.github/workflows/email-help-15min.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --check first-discovery.js
      - run: node --check kisisel-bilgiler.js
      - run: node --test tests/email-help-15min-regression.test.cjs
