name: Papi startup regression checks
on:
  push:
    paths: ['index.html', 'papi-loading.*', 'portal-bootstrap.js', 'tests/portal-bootstrap.test.cjs', '.github/workflows/papi-startup.yml']
  pull_request:
    paths: ['index.html', 'papi-loading.*', 'portal-bootstrap.js', 'tests/portal-bootstrap.test.cjs', '.github/workflows/papi-startup.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/portal-bootstrap.test.cjs tests/portal-integrity.test.cjs tests/post-login-defer.test.cjs
