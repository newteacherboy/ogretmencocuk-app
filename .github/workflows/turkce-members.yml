name: Türkçe üyelik ve kontrol merkezi
on:
  pull_request:
    paths: ['welcome.*', 'parkur.html', 'app-gate.js', 'assets/welcome/**', 'assets/questions/**', 'assets/games/**', 'games-modern.css', 'tools/games-browser.cjs', 'curriculum.js', 'question-feedback.css', 'tools/question-browser.cjs', 'tools/welcome-browser.cjs', 'app.js', 'index.html', 'hesap.html', 'member-*', 'topic-games.*', 'assets/topic-games/**', 'tools/build-topic-games.py', 'supabase/functions/turkce-features/**', 'turkce-auth.mjs', 'supabase/member-release/**', 'supabase/functions/diji-api/turkce-member*', 'tests/turkce-members*', '.github/workflows/turkce-members.yml']
  push:
    branches: [main]
    paths: ['welcome.*', 'parkur.html', 'app-gate.js', 'assets/welcome/**', 'assets/questions/**', 'assets/games/**', 'games-modern.css', 'tools/games-browser.cjs', 'curriculum.js', 'question-feedback.css', 'tools/question-browser.cjs', 'tools/welcome-browser.cjs', 'app.js', 'index.html', 'hesap.html', 'member-*', 'topic-games.*', 'assets/topic-games/**', 'tools/build-topic-games.py', 'supabase/functions/turkce-features/**', 'turkce-auth.mjs', 'supabase/member-release/**', 'supabase/functions/diji-api/turkce-member*', 'tests/turkce-members*', '.github/workflows/turkce-members.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools --ignore-scripts
      - run: node --test tests/study-sound.test.cjs tests/turkce-*.test.mjs tests/member-tools.test.cjs tests/api-security-guards.test.cjs tests/daily-mission-claim.test.cjs tests/onboarding-registration.test.cjs tests/server-reward-ledger.test.cjs
      - run: node tests/turkce-members-db.cjs && node tests/turkce-simple-accounts-db.cjs && node tests/turkce-game-rounds-db.cjs && node tests/turkce-learning-hub-db.cjs && node tests/turkce-account-missions-db.cjs
      - run: node tools/icerik-dogrula.mjs && node tools/turkce-paketle.mjs --check

  welcome-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - name: Select runner browser
        shell: bash
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if test -n "$browser_path"; then
            echo "BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node tools/welcome-browser.cjs
      - run: node tools/question-browser.cjs
      - run: node tools/games-browser.cjs
      - run: node tools/leagues-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turkce-karsilama-ekranlari
          path: |
            /tmp/turkce-welcome-ui/
            /tmp/turkce-question-ui/
            /tmp/turkce-games-ui/
            /tmp/league-*.png
