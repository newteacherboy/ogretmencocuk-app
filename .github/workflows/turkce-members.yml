name: Türkçe üyelik ve kontrol merkezi
on:
  pull_request:
    paths: ['welcome.*', 'parkur.html', 'app-gate.js', 'assets/welcome/**', 'tools/welcome-browser.cjs', 'app.js', 'index.html', 'hesap.html', 'member-*', 'turkce-auth.mjs', 'supabase/member-release/**', 'supabase/functions/diji-api/turkce-member*', 'tests/turkce-members*', '.github/workflows/turkce-members.yml']
  push:
    branches: [main]
    paths: ['welcome.*', 'parkur.html', 'app-gate.js', 'assets/welcome/**', 'tools/welcome-browser.cjs', 'app.js', 'index.html', 'hesap.html', 'member-*', 'turkce-auth.mjs', 'supabase/member-release/**', 'supabase/functions/diji-api/turkce-member*', 'tests/turkce-members*', '.github/workflows/turkce-members.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools --ignore-scripts
      - run: node --test tests/turkce-*.test.mjs tests/member-tools.test.cjs tests/api-security-guards.test.cjs tests/daily-mission-claim.test.cjs tests/onboarding-registration.test.cjs tests/server-reward-ledger.test.cjs
      - run: node tests/turkce-members-db.cjs
      - run: node tools/icerik-dogrula.mjs && node tools/turkce-paketle.mjs --check

  welcome-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tools/welcome-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turkce-karşılama-ekranlari
          path: /tmp/turkce-welcome-ui/
