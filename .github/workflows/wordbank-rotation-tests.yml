name: Word Bank Rotation Tests
on:
  pull_request:
    paths:
      - 'supabase/functions/diji-api/word-bank-rotation.ts'
      - 'supabase/functions/diji-api/word-wheel-api.ts'
      - 'supabase/functions/diji-api/meteor-api.ts'
      - 'tests/word-bank-rotation.test.cjs'
      - 'tests/harf-bahcesi-round-size.test.cjs'
      - 'tests/selected-eight-game-boards.test.cjs'
      - 'game-experience.js'
      - 'game-experience.css'
      - 'harf-bahcesi.css'
      - 'tests/dm-matches-12-rounds.test.cjs'
      - 'supabase/diji-medu-gecmisi/20261010160000_dm_matches_12_questions.sql'
      - 'medupro.js'
      - 'harf-bahcesi.js'
      - '.github/workflows/wordbank-rotation-tests.yml'
  workflow_dispatch:
jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared rotation
        run: node --test tests/word-bank-rotation.test.cjs tests/harf-bahcesi-round-size.test.cjs tests/dm-matches-12-rounds.test.cjs tests/selected-eight-game-boards.test.cjs
