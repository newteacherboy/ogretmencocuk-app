<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diji-Medu Türkçe – Hesap</title><style>
*{box-sizing:border-box}body{font:16px system-ui;background:#edf5ff;color:#223b70;margin:0;padding:20px}.wrap{max-width:750px;margin:auto}.card{background:white;border:1px solid #e0e8fa;border-radius:22px;padding:22px;margin:14px 0}h1,h2{color:#274699}label{display:grid;gap:5px;margin:12px 0}input,select,button{font:inherit;min-height:44px;padding:11px;border-radius:12px;border:1px solid #bdcde8;width:100%}button{background:#2969ce;color:white;border:0;cursor:pointer;font-weight:750}button:disabled{opacity:.5}small{color:#536582}.hidden{display:none}a{color:#2054ac}#auth-status{font-weight:700;padding:10px}
</style></head><body><div class="wrap"><h1>Diji-Medu Türkçe</h1><p><a href="./">← Parkura dön</a></p><div class="card"><strong id="account-state">Giriş yapılmadı</strong><button id="logout" hidden>Çıkış yap</button></div><div class="card"><h2>Üye ol</h2><p><small>E-posta yalnızca hesap doğrulaması içindir; arkadaşlarına gösterilmez.</small></p><form id="register">
<label>Kullanıcı adı<input name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}" required></label>
<label>E-posta adresi<input name="email" type="email" autocomplete="email" required></label>
<label>Şifre<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
<label>Sınıf<select name="grade" required><option value="5">5. sınıf</option><option value="6">6. sınıf</option><option value="7">7. sınıf</option><option value="8">8. sınıf</option></select></label>
<button id="register-submit">Hesap oluştur</button></form></div><div class="card"><h2>Hesabım var</h2><form id="login"><label>E-posta<input type="email" name="email" required autocomplete="email"></label><label>Şifre<input name="password" type="password" autocomplete="current-password" required></label><button id="login-submit">Giriş yap</button></form></div><p id="auth-status" role="status" aria-live="polite"></p></div>
<script>window.TURKCE_SUPABASE_URL=null;window.TURKCE_SUPABASE_PUBLISHABLE_KEY=null;</script><script type="module" src="./turkce-auth.mjs"></script></body></html>
